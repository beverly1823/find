# 学科组合：需求学科含指定学科 且 标题/正文含指定词
subject_combo:
  - subject: 海洋科学
    words: [化学, 地球化学, 示踪, 营养盐, 痕量, 同位素, 酸化, 碳汇]
  - subject: 化学
    words: [海洋, 海水, 河口]

# 机构组合：标题含指定机构词 且 正文含化学词
org_combo:
  orgs: [海洋研究所, 海洋中心, 海洋地质, 海洋环境, 河口海岸, 崂山实验室,
         海洋科学与工程, 海洋科学与技术, 海洋研究院, 海洋学院]
  words: [化学, 地球化学, 分析, 示踪, 同位素, 营养盐]
