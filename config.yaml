# 海洋化学招聘信息聚合 - 采集配置

# 请求参数（对每个来源生效，礼貌抓取）
min_delay: 0.4
max_delay: 0.9
source_timeout: 25

scan:
  # 单次增量最多扫描的 ID 数（防止长期停摆后扫描量爆炸）
  daily_window: 600
  # 增量模式下单来源请求上限
  max_requests: 1200

# ---------- 信息来源 ----------
sources:
  - type: gaoxiaojob
    name: gaoxiaojob
    base: https://www.gaoxiaojob.com
    enabled: true
    # 被限流过，降速采集
    min_delay: 0.9
    max_delay: 1.6
    # 学科栏目页（服务端渲染，用于发现最新公告 ID 前沿）
    frontier_columns:
      - /column/1.html     # 高校招聘
      - /column/143.html   # 海洋科学
      - /column/139.html   # 化学
    # 已知相关公告 ID（每次运行自动复查，更新截止日期）
    seed_ids: [407819, 418207, 422277, 427627, 412571]
    backfill_cap: 20000

  - type: sciencehr
    name: sciencehr
    base: https://www.sciencehr.net
    enabled: true
    # 前沿发现的起始 ID（之后自动上探+二分）
    seed_ids: [267824]
    backfill_cap: 3000  # 科学人才网单页较慢，控制回填规模

  - type: shiyebian
    name: shiyebian
    base: https://www.shiyebian.net
    enabled: true
    # 已知涉海公告种子（海洋一/二/三/四所、部属单位第二批）
    seed_ids: [507569, 507624, 507570, 507571, 508219]
    backfill_cap: 8000  # 覆盖到 4 月，含自然资源部系统集中招聘期

  - type: gaoxiaojob_job
    name: gaoxiaojob_job
    base: https://m.gaoxiaojob.com
    enabled: true
    # 职位级岗位（公告拆分的具体职位），带需求专业/地点，化学岗金标准
    min_delay: 0.9
    max_delay: 1.6
    seed_ids: [2193507, 2193504, 2193505, 2193506, 2193508, 2193509, 2193510,
               2013175, 2233370]
    backfill_cap: 15000

  - type: cssc
    name: cssc
    base: http://www.cssc.net.cn
    enabled: true
    # 中船集团官网招聘栏目（列表型）：央企秋招公告官方直采

# ---------- 机构类规则 ----------

# 海洋系统单位：标题含以下词 → 直接收录（自然资源部/海洋局/部委直属）
ocean_org_words:
  - 海洋局
  - 海洋发展局
  - 自然资源部
  - 自然资源局
  - 海洋中心
  - 海洋环境监测
  - 海洋预报
  - 海洋信息中心
  - 海洋档案馆
  - 海洋技术中心
  - 北海局
  - 东海局
  - 南海局
  - 海洋科学研究所
  - 海洋研究所
  - 海洋研究院所

# 央企国企：direct 名单直接命中；with_ocean 需叠加海洋语境词
soe_rules:
  direct:
    - 中海油
    - 中国海油
    - 海油工程
    - 中海石油
    - 海洋石油
    - 中国船舶集团
    - 中船集团
    - 中船重工
    - 江南造船
    - 沪东中华
    - 中远海运
    - 海洋工程装备
    - 海洋装备
    - 海洋科技
  with_ocean:
    orgs:
      - 中交
      - 中国电建
      - 中国能建
      - 中广核
      - 招商局
      - 国电投
      - 中核
      - 华能
      - 中石化
      - 中石油
      - 中国中铁
      - 中国铁建
    ocean:
      - 海洋
      - 海上
      - 海水
      - 航道
      - 港口
      - 疏浚
      - 海工
      - 海缆
      - 海风

